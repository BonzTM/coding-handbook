services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://app:app@postgres:5432/app
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 20s

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
