apiVersion: batch/v1
kind: Job
metadata:
  name: <APP_NAME>-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: <IMAGE_BY_DIGEST>
          command: ["npm", "run", "migrate", "--", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: <APP_NAME>-database
                  key: url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <APP_NAME>
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: <APP_NAME>
  template:
    metadata:
      labels:
        app.kubernetes.io/name: <APP_NAME>
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: <IMAGE_BY_DIGEST>
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: <APP_NAME>-database
                  key: url
          resources:
            requests:
              cpu: <CPU_REQUEST>
              memory: <MEMORY_REQUEST>
            limits:
              cpu: <CPU_LIMIT>
              memory: <MEMORY_LIMIT>
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: <APP_NAME>
spec:
  selector:
    app.kubernetes.io/name: <APP_NAME>
  ports:
    - name: http
      port: 80
      targetPort: http
