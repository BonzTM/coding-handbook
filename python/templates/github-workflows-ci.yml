# Thin CI caller for the committed Makefile. Destination: .github/workflows/ci.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: make verify

  # Keep this job for database-backed applications; remove it for other shapes.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: <app>
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d <app>"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: make sync
      - run: make test-integration
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/<app>

  # Libraries and compatibility-sensitive apps prove the promised floor.
  python-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true
          cache-suffix: py311
      - run: make verify
