[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[project]
name = "exampleservice"
version = "0.1.0"
description = "Reference FastAPI orders sidecar for the Python engineering handbook"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Coding Handbook Maintainers" }]
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-sdk==1.44.0",
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.1",
]

[project.scripts]
exampleservice = "exampleservice.__main__:main"

[dependency-groups]
dev = [
    "import-linter==2.13",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
module-name = "exampleservice"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "C4", "DTZ", "E", "F", "FURB", "I", "ISC", "N",
    "PERF", "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "T20", "TID",
    "TRY", "UP", "W",
]
ignore = [
    "E501", "ISC001", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "TRY003",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["exampleservice"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
pretty = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration' --cov=exampleservice --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: requires a real external dependency such as PostgreSQL or a broker",
]

[tool.coverage.run]
branch = true
source = ["exampleservice"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.importlinter]
root_package = "exampleservice"

[[tool.importlinter.contracts]]
name = "Core does not import adapters"
type = "forbidden"
source_modules = ["exampleservice.core"]
forbidden_modules = [
    "exampleservice.api",
    "exampleservice.clients",
    "exampleservice.config",
    "exampleservice.db",
    "exampleservice.telemetry",
    "exampleservice.workers",
]

[[tool.importlinter.contracts]]
name = "Adapters do not shortcut through other adapters"
type = "independence"
modules = [
    "exampleservice.api",
    "exampleservice.clients",
    "exampleservice.db",
    "exampleservice.telemetry",
    "exampleservice.workers",
]
